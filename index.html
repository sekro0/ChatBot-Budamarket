<script>
(function() {
  var WEBHOOK_URL = 'https://n8n.srv1534236.hstgr.cloud/webhook/chat-budamarket';
  var _wt = atob('YnVkYW1hcmtldF93aWRnZXRfMjAyNQ==');
  var MAX_LEN = 500;
  var RATE_MS = 1500;
  var MAX_SESS = 80;
  var _lastT = 0;
  var _cnt = 0;
  var SESSION_ID = 'u_' + (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'').slice(0,16) : Date.now().toString(36) + Math.random().toString(36).slice(2,8));
  var chatOpened  = false;
  var isOpen      = false;
  var userName    = '';
  var userEmail   = '';
  var userTelefono = '';

  function addMsg(type, text) {
    var c = document.getElementById('buda-messages');
    var m = document.createElement('div');
    m.style.cssText = 'max-width:80%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;font-weight:600;word-break:break-word;margin-bottom:2px;';
    if (type === 'bot') {
      m.style.cssText += 'background:white;color:#2D2D2D;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.07);';
    } else {
      m.style.cssText += 'background:linear-gradient(135deg,#FF6B00,#FF9A3C);color:white;align-self:flex-end;border-bottom-right-radius:4px;';
    }
    var urlRegex = /(https?:\/\/[^\s]+)/g;
    function formatBotText(raw) {
      return raw
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/\*([^*<\n]+)\*/g,'<strong>$1</strong>')
        .replace(/(^|\n)([\u2022]) /g,'$1<span style="color:#FF6B00;font-weight:800;">•</span> ')
        .replace(/(^|\n)- /g,'$1<span style="color:#FF6B00;font-weight:800;">•</span> ')
        .replace(/([.!?]) (\d+[.)][\s])/g,'$1<br><strong style="color:#FF6B00;">$2</strong>')
        .replace(/:[\s](\d+[.)][\s])/g,':<br><strong style="color:#FF6B00;">$1</strong>')
        .replace(/\n/g,'<br>')
        .replace(/(<br>|^)(\d+[.)][\s])/g,'$1<strong style="color:#FF6B00;">$2</strong>');
    }
    var safeText = type === 'bot' ? formatBotText(text) : text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    m.innerHTML = safeText.replace(urlRegex, function(url) {
      var su = url.replace(/['"><]/g, function(c){return{"'":'%27','"':'%22','>':'%3E','<':'%3C'}[c];});
      if(!/^https:\/\//i.test(su)) return su;
      return '<a href="' + su + '" target="_blank" rel="noopener noreferrer" style="color:#FF6B00;text-decoration:underline;word-break:break-all;">' + su + '</a>';
    });
    c.appendChild(m);
    c.scrollTop = c.scrollHeight;
  }

  function showTyping() {
    var c = document.getElementById('buda-messages');
    var t = document.createElement('div');
    t.id = 'buda-typing';
    t.style.cssText = 'display:flex;align-items:center;gap:5px;background:white;padding:12px 16px;border-radius:16px;border-bottom-left-radius:4px;align-self:flex-start;box-shadow:0 2px 8px rgba(0,0,0,0.07);';
    t.innerHTML = '<span style="width:7px;height:7px;background:#FF6B00;border-radius:50%;display:inline-block;animation:bt 1.2s infinite;"></span><span style="width:7px;height:7px;background:#FF6B00;border-radius:50%;display:inline-block;animation:bt 1.2s 0.2s infinite;"></span><span style="width:7px;height:7px;background:#FF6B00;border-radius:50%;display:inline-block;animation:bt 1.2s 0.4s infinite;"></span>';
    c.appendChild(t);
    c.scrollTop = c.scrollHeight;
  }

  function hideTyping() {
    var t = document.getElementById('buda-typing');
    if (t) t.remove();
  }

  function sendMsg() {
    var input = document.getElementById('buda-input');
    var text = input.value.trim().slice(0, MAX_LEN).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,'');
    if (!text) return;
    addMsg('user', text);
    input.value = '';
    input.disabled = true;
    showTyping();
    var now = Date.now();
    if (now - _lastT < RATE_MS || _cnt >= MAX_SESS) {
      hideTyping(); input.disabled = false; input.focus(); return;
    }
    _lastT = now; _cnt++;
    var ac = new AbortController();
    var tid = setTimeout(function(){ ac.abort(); }, 45000);
    fetch(WEBHOOK_URL, {
      method: 'POST',
      signal: ac.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: SESSION_ID, message: text, nombre: userName, email: userEmail, telefono: userTelefono, _wt: _wt })
    })
    .then(function(r) { clearTimeout(tid); return r.json(); })
    .then(function(d) {
      hideTyping();
      addMsg('bot', d.response || 'Hubo un problema. Intentá de nuevo.');
    })
    .catch(function(e) {
      clearTimeout(tid);
      hideTyping();
      addMsg('bot', e && e.name === 'AbortError' ? 'La respuesta tardó demasiado. Intentá de nuevo.' : 'No pude conectarme. Intentá de nuevo en unos segundos.');
    })
    .finally(function() {
      input.disabled = false;
      input.focus();
    });
  }

  function toggleChat() {
    var win       = document.getElementById('buda-chat-window');
    var iconChat  = document.getElementById('buda-icon-chat');
    var iconClose = document.getElementById('buda-icon-close');
    isOpen = !isOpen;
    if (isOpen) {
      win.style.display = 'flex';
      // Trigger reflow so transition plays
      win.getBoundingClientRect();
      win.style.transform = 'scale(1)';
      win.style.opacity   = '1';
      iconChat.style.display  = 'none';
      iconClose.style.display = 'block';
      if (!chatOpened) {
        chatOpened = true;
      }
      setTimeout(function() { document.getElementById('buda-nombre').focus(); }, 300);
    } else {
      win.style.transform = 'scale(0.85)';
      win.style.opacity   = '0';
      setTimeout(function() { win.style.display = 'none'; }, 220);
      iconChat.style.display  = 'block';
      iconClose.style.display = 'none';
    }
  }

  // Esperar a que el DOM esté listo y usar addEventListener
  function init() {
    var btn   = document.getElementById('buda-chat-btn');
    var send  = document.getElementById('buda-send');
    var input = document.getElementById('buda-input');
    if (!btn) { setTimeout(init, 100); return; }
    btn.addEventListener('click', function() {
      animateEl(btn, 'buda-anim-bounce');
      toggleChat();
    });
    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      animateEl(btn, 'buda-anim-bounce');
      toggleChat();
    });
    btn.addEventListener('mouseenter', function() {
      btn.style.transform = 'scale(1.08)';
      btn.style.boxShadow = '0 6px 20px rgba(255,107,0,0.38)';
    });
    btn.addEventListener('mouseleave', function() {
      btn.style.transform = 'scale(1)';
      btn.style.boxShadow = '0 4px 14px rgba(255,107,0,0.22)';
    });
    btn.addEventListener('mousedown', function() {
      btn.style.transform = 'scale(0.92)';
      btn.style.boxShadow = '0 2px 8px rgba(255,107,0,0.18)';
    });
    btn.addEventListener('mouseup', function() {
      btn.style.transform = 'scale(1.08)';
      btn.style.boxShadow = '0 6px 20px rgba(255,107,0,0.38)';
    });
    send.addEventListener('click', function() {
      animateEl(send, 'buda-anim-scale');
      sendMsg();
    });
    send.addEventListener('touchend', function(e) {
      e.preventDefault();
      animateEl(send, 'buda-anim-scale');
      sendMsg();
    });
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMsg(); });

    // Prechat form
    var prechatBtn = document.getElementById('buda-prechat-btn');
    var prechatErr = document.getElementById('buda-prechat-error');
    function animateEl(el, cls) {
      el.classList.remove('buda-anim-scale','buda-anim-bounce','buda-anim-shake');
      void el.offsetWidth;
      el.classList.add(cls);
      el.addEventListener('animationend', function(){ el.classList.remove(cls); }, {once:true});
    }
    prechatBtn.addEventListener('touchend', function(e) { e.preventDefault(); prechatBtn.click(); });
    prechatBtn.addEventListener('click', function() {
      var nombre = document.getElementById('buda-nombre').value.trim();
      var email  = document.getElementById('buda-email').value.trim();
      if (!nombre || !email) {
        prechatErr.style.display = 'block';
        animateEl(prechatBtn, 'buda-anim-shake');
        return;
      }
      userName  = nombre;
      userEmail = email;
      userTelefono = document.getElementById('buda-telefono').value.trim();
      // Guardar prospecto al iniciar chat
      var ac2 = new AbortController(); setTimeout(function(){ ac2.abort(); }, 20000);
      fetch(WEBHOOK_URL, {
        method: 'POST', signal: ac2.signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: SESSION_ID, message: '__init__', nombre: userName, email: userEmail, telefono: userTelefono, _wt: _wt })
      }).catch(function() {});
      animateEl(prechatBtn, 'buda-anim-bounce');
      setTimeout(function() { document.getElementById('buda-prechat').style.display = 'none'; }, 200);
      var msgs = document.getElementById('buda-messages');
      msgs.style.display = 'flex';
      var inputArea = document.getElementById('buda-input-area');
      inputArea.style.display = 'flex';
      setTimeout(function() {
        var sn = nombre.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        addMsg('bot', '¡Hola ' + sn + '! 👋 Soy el asistente de Budamarket. ¿En qué te puedo ayudar hoy?');
      }, 200);
      setTimeout(function() { document.getElementById('buda-input').focus(); }, 300);
    });
    document.getElementById('buda-nombre').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('buda-email').focus();
    });
    document.getElementById('buda-email').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('buda-telefono').focus();
    });
    document.getElementById('buda-telefono').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') prechatBtn.click();
    });

    var style = document.createElement('style');
    style.textContent = '@keyframes bt{0%,100%{opacity:0.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}} @keyframes buda-scale{0%{transform:scale(1)}40%{transform:scale(0.92)}70%{transform:scale(1.06)}100%{transform:scale(1)}} @keyframes buda-bounce{0%{transform:scale(1)}30%{transform:scale(0.93)}60%{transform:scale(1.08)}80%{transform:scale(0.97)}100%{transform:scale(1)}} @keyframes buda-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}} .buda-anim-scale{animation:buda-scale 0.3s ease forwards} .buda-anim-bounce{animation:buda-bounce 0.45s ease forwards} .buda-anim-shake{animation:buda-shake 0.4s ease forwards} #buda-messages::-webkit-scrollbar{width:4px} #buda-messages::-webkit-scrollbar-thumb{background:#FFD4B0;border-radius:4px}';
    document.head.appendChild(style);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
